name: Backend CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mqi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mqi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mqi?schema=public
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mqi?schema=public
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mqi?schema=public
      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mqi?schema=public
      - name: Build production Docker image
        run: docker build -t mqi-backend:ci .